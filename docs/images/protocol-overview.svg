<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="488" viewBox="0 0 1024 488" role="img" aria-labelledby="protocol-overview-title protocol-overview-desc" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif"><style>
.po-canvas {
  fill: #ffffff;
}

.po-person {
  fill: #d9dcf8;
}

.po-head {
  fill: #4f46e5;
}

.po-head-optional {
  fill: #b45309;
}

