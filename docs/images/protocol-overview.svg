</style><rect class="po-canvas" x="-10" y="0" width="780" height="482"></rect><title id="protocol-overview-title">PACT at a glance</title><desc id="protocol-overview-desc">The User asks their personal agent for help. The personal agent, registered once with the Provider, reads the Brand&#x27;s Agent Card and sends a message signed with its own key. The Provider verifies the JWT against the personal agent&#x27;s public keys, the Brand&#x27;s agent replies with a contextId, and the personal agent relays the answer. Optionally, the User logs in with the Brand and approves scopes so the agent can act on their account.</desc><defs><marker id="po-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="po-head"></path></marker><marker id="po-head-setup" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="po-head-setup"></path></marker><marker id="po-head-optional" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="po-head-optional"></path></marker></defs><rect class="po-zone" x="-8" y="4" width="506" height="474" rx="14"></rect><rect class="po-zone po-zone-business" x="498" y="4" width="270" height="474" rx="14"></rect><text class="po-zone-label" x="4" y="30">PERSONAL AGENT SIDE</text><text class="po-zone-label" x="516" y="30">PROVIDER SIDE</text><line class="po-boundary" x1="498" y1="40" x2="498" y2="472"></line><g><rect class="po-actor" x="0" y="56" width="116" height="348" rx="12"></rect><text class="po-actor-title" x="58" y="78" text-anchor="middle">User</text><text class="po-actor-subtitle" x="58" y="93" text-anchor="middle">anonymous id</text></g><g><rect class="po-actor" x="244" y="56" width="184" height="348" rx="12"></rect><text class="po-actor-title" x="336" y="78" text-anchor="middle">Personal agent</text><text class="po-actor-subtitle" x="336" y="93" text-anchor="middle">acts for the User</text></g><g><rect class="po-actor" x="568" y="56" width="192" height="348" rx="12"></rect><text class="po-actor-title" x="664" y="78" text-anchor="middle">Provider</text><text class="po-actor-subtitle" x="664" y="93" text-anchor="middle">hosts Brands&#x27; agents</text></g><g class="po-person" transform="translate(58 228)"><circle cx="0" cy="-26" r="13"></circle><path d="M -24 18 a 24 24 0 0 1 48 0 z"></path></g><g><rect class="po-part" x="256" y="158" width="160" height="40" rx="8"></rect><text class="po-part-label" x="336" y="176" text-anchor="middle">Assistant</text><text class="po-part-detail" x="336" y="190" text-anchor="middle">talks to the User</text></g><g><rect class="po-part" x="256" y="216" width="160" height="40" rx="8"></rect><text class="po-part-label" x="336" y="234" text-anchor="middle">Signing key</text><text class="po-part-detail" x="336" y="248" text-anchor="middle">private, server-only</text></g><g><rect class="po-part" x="256" y="274" width="160" height="40" rx="8"></rect><text class="po-part-label" x="336" y="292" text-anchor="middle">Public keys</text><text class="po-part-detail" x="336" y="306" text-anchor="middle">/.well-known/jwks.json</text></g><g><rect class="po-part" x="580" y="106" width="168" height="40" rx="8"></rect><text class="po-part-label" x="664" y="124" text-anchor="middle">Registered agents</text><text class="po-part-detail" x="664" y="138" text-anchor="middle">issuer · keys URL · audience</text></g><g><rect class="po-part" x="580" y="158" width="168" height="40" rx="8"></rect><text class="po-part-label" x="664" y="176" text-anchor="middle">Agent Card</text><text class="po-part-detail" x="664" y="190" text-anchor="middle">/a2a/{brandId}</text></g><g><rect class="po-part" x="580" y="216" width="168" height="40" rx="8"></rect><text class="po-part-label" x="664" y="234" text-anchor="middle">Token check</text><text class="po-part-detail" x="664" y="248" text-anchor="middle">signature · issuer · audience</text></g><g><rect class="po-part po-part-accent" x="580" y="318" width="168" height="60" rx="8"></rect><text class="po-part-label" x="664" y="346" text-anchor="middle">Brand&#x27;s agent</text><text class="po-part-detail" x="664" y="360" text-anchor="middle">one conversation per User</text></g><line class="po-internal" x1="664" y1="260" x2="664" y2="312" marker-end="url(#po-head)"></line><path class="po-arrow po-arrow-optional" d="M 58 408 V 448 H 664 V 410" fill="none" marker-end="url(#po-head-optional)"></path><text class="po-arrow-label" x="336" y="433" text-anchor="middle">Authorize (optional): User logs in with the Brand, approves scopes (spec §5)</text><circle class="po-step po-step-optional" cx="336" cy="448" r="9"></circle><text class="po-step-number" x="336" y="451.5" text-anchor="middle">A</text><g><line class="po-arrow po-arrow-setup" x1="432" y1="126" x2="564" y2="126" marker-end="url(#po-head-setup)"></line><text class="po-arrow-label" x="498" y="111" text-anchor="middle">Register (once)</text><circle class="po-step po-step-setup" cx="498" cy="126" r="9"></circle><text class="po-step-number" x="498" y="129.5" text-anchor="middle">1</text></g><g><line class="po-arrow" x1="120" y1="178" x2="240" y2="178" marker-end="url(#po-head)"></line><text class="po-arrow-label" x="180" y="163" text-anchor="middle">Ask</text></g><g><line class="po-arrow" x1="432" y1="178" x2="564" y2="178" marker-end="url(#po-head)"></line><text class="po-arrow-label" x="498" y="163" text-anchor="middle">Get Agent Card</text><circle class="po-step" cx="498" cy="178" r="9"></circle><text class="po-step-number" x="498" y="181.5" text-anchor="middle">2</text></g><g><line class="po-arrow" x1="432" y1="236" x2="564" y2="236" marker-end="url(#po-head)"></line><text class="po-arrow-label" x="498" y="221" text-anchor="middle">Message + token</text><circle class="po-step" cx="498" cy="236" r="9"></circle><text class="po-step-number" x="498" y="239.5" text-anchor="middle">3</text></g><g><line class="po-arrow" x1="564" y1="294" x2="432" y2="294" marker-end="url(#po-head)"></line><text class="po-arrow-label" x="498" y="279" text-anchor="middle">Fetch keys, verify</text><circle class="po-step" cx="498" cy="294" r="9"></circle><text class="po-step-number" x="498" y="297.5" text-anchor="middle">4</text></g><g><line class="po-arrow" x1="564" y1="362" x2="432" y2="362" marker-end="url(#po-head)"></line><text class="po-arrow-label" x="498" y="347" text-anchor="middle">Reply + contextId</text><circle class="po-step" cx="498" cy="362" r="9"></circle><text class="po-step-number" x="498" y="365.5" text-anchor="middle">5</text></g><g><line class="po-arrow" x1="240" y1="362" x2="120" y2="362" marker-end="url(#po-head)"></line><text class="po-arrow-label" x="180" y="347" text-anchor="middle">Answer</text></g></svg>
