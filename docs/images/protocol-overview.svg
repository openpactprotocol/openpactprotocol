  stroke: #e5e7eb;
  stroke-width: 1.2;
}

.po-column {
  stroke: #e5e7eb;
  stroke-width: 1.2;
  stroke-dasharray: 2 4;
}

.po-lane-title {
  fill: #111827;
  font-size: 15px;
  font-weight: 700;
}

.po-lane-note {
  fill: #6b7280;
  font-size: 12px;
}

.po-index {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12px;
  font-weight: 700;
}

.po-index-trust {
  fill: #4f46e5;
}

.po-index-consent {
  fill: #b45309;
}

.po-column-title {
  fill: #111827;
  font-size: 15px;
  font-weight: 700;
}

.po-pill {
  fill: #ffffff;
  stroke-width: 1.4;
}

