<svg xmlns="http://www.w3.org/2000/svg" width="780" height="482" viewBox="-10 0 780 482" role="img" aria-labelledby="protocol-overview-title protocol-overview-desc" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif"><style>
.po-canvas {
