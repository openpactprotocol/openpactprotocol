<svg xmlns="http://www.w3.org/2000/svg" width="780" height="490" viewBox="-10 0 780 490" role="img" aria-labelledby="delegated-authority-title delegated-authority-desc" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif"><style>
