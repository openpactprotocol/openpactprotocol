<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="488" viewBox="0 0 1024 488" role="img" aria-labelledby="delegated-authority-title delegated-authority-desc" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif"><style>
.po-canvas {
  fill: #ffffff;
}

.po-person {
  fill: #d9dcf8;
}

.po-head {
  fill: #4f46e5;
}

.po-head-optional {
  fill: #b45309;
}

.po-lane {
  stroke: #e5e7eb;
  stroke-width: 1.2;
}

.po-column {
  stroke: #e5e7eb;
  stroke-width: 1.2;
  stroke-dasharray: 2 4;
}

.po-lane-title {
  fill: #111827;
  font-size: 15px;
  font-weight: 700;
}

.po-lane-note {
  fill: #6b7280;
  font-size: 12px;
}

.po-index {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12px;
  font-weight: 700;
}

.po-index-trust {
  fill: #4f46e5;
}

.po-index-consent {
  fill: #b45309;
}

.po-column-title {
  fill: #111827;
  font-size: 15px;
  font-weight: 700;
}

.po-pill {
  fill: #ffffff;
  stroke-width: 1.4;
}

.po-pill-trust {
  stroke: #a5b4fc;
}

.po-pill-consent {
  stroke: #fdba74;
}

.po-pill-text {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12px;
}

.po-pill-text-trust {
  fill: #4f46e5;
}

.po-pill-text-consent {
  fill: #b45309;
}

.po-flow {
  stroke-width: 1.7;
}

.po-flow-trust {
  stroke: #4f46e5;
}

.po-flow-consent {
  stroke: #b45309;
}

.po-flow-dashed {
  stroke-dasharray: 3 4;
}

.po-description {
  fill: #6b7280;
  font-size: 12.5px;
}
</style><rect class="po-canvas" x="0" y="0" width="1024" height="488" rx="16"></rect><title id="delegated-authority-title">Delegated authority</title><desc id="delegated-authority-desc">The personal agent requests scopes and shows the User a login link. The User logs in with the Brand and approves scopes directly with the Provider; the personal agent never sees the login. The Provider signs a delegation token that the personal agent carries but cannot edit. On each message the Provider checks the token, and the Brand&#x27;s agent can only use the approved scopes. Every reply carries a signed receipt.</desc><defs><marker id="po-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="po-head"></path></marker><marker id="po-head-optional" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="po-head-optional"></path></marker></defs><line class="po-lane" x1="156" y1="148" x2="1006" y2="148"></line><line class="po-lane" x1="156" y1="252" x2="1006" y2="252"></line><line class="po-lane" x1="156" y1="356" x2="1006" y2="356"></line><line class="po-column" x1="326" y1="36" x2="326" y2="466"></line><line class="po-column" x1="496" y1="36" x2="496" y2="466"></line><line class="po-column" x1="666" y1="36" x2="666" y2="466"></line><line class="po-column" x1="836" y1="36" x2="836" y2="466"></line><g class="po-person" transform="translate(36 146)"><circle cx="0" cy="-9" r="7"></circle><path d="M -13 11 a 13 13 0 0 1 26 0 z"></path></g><text class="po-lane-title" x="58" y="153">User</text><text class="po-lane-title" x="18" y="257">Personal agent</text><text class="po-lane-note" x="18" y="276">acts for the User</text><text class="po-lane-title" x="18" y="361">Brand&#x27;s agent</text><text class="po-lane-note" x="18" y="380"><tspan x="18" dy="0">hosted by a Provider</tspan><tspan x="18" dy="16">defines the scopes</tspan></text><g><text class="po-index po-index-consent" x="168" y="46">01</text><text class="po-column-title" x="168" y="67"><tspan x="168" dy="0">Request scopes</tspan></text><g><line class="po-flow po-flow-consent" x1="241" y1="260" x2="241" y2="346" marker-end="url(#po-head-optional)"></line><g><rect class="po-pill po-pill-consent" x="204" y="292" width="74" height="24" rx="12"></rect><text class="po-pill-text po-pill-text-consent" x="241" y="308" text-anchor="middle">scopes</text></g></g><text class="po-description" x="168" y="396"><tspan x="168" dy="0">The personal agent asks</tspan><tspan x="168" dy="16.5">the Provider for the</tspan><tspan x="168" dy="16.5">scopes it needs, with</tspan><tspan x="168" dy="16.5">its JWT as the client</tspan><tspan x="168" dy="16.5">credential (§5.3).</tspan></text></g><g><text class="po-index po-index-consent" x="338" y="46">02</text><text class="po-column-title" x="338" y="67"><tspan x="338" dy="0">Login link</tspan></text><g><line class="po-flow po-flow-consent" x1="411" y1="262" x2="411" y2="348" marker-start="url(#po-head-optional)"></line><g><rect class="po-pill po-pill-consent" x="362" y="292" width="98" height="24" rx="12"></rect><text class="po-pill-text po-pill-text-consent" x="411" y="308" text-anchor="middle">login link</text></g></g><g><line class="po-flow po-flow-consent" x1="411" y1="242" x2="411" y2="216"></line><line class="po-flow po-flow-consent" x1="411" y1="184" x2="411" y2="160" marker-end="url(#po-head-optional)"></line><g><rect class="po-pill po-pill-consent" x="365" y="188" width="92" height="24" rx="12"></rect><text class="po-pill-text po-pill-text-consent" x="411" y="204" text-anchor="middle">show link</text></g></g><text class="po-description" x="338" y="396"><tspan x="338" dy="0">The Provider returns a</tspan><tspan x="338" dy="16.5">link to the Brand&#x27;s own</tspan><tspan x="338" dy="16.5">login. The personal agent</tspan><tspan x="338" dy="16.5">only shows it; it never</tspan><tspan x="338" dy="16.5">handles the login.</tspan></text></g><g><text class="po-index po-index-consent" x="508" y="46">03</text><text class="po-column-title" x="508" y="67"><tspan x="508" dy="0">Sign in and</tspan><tspan x="508" dy="19">approve</tspan></text><g><line class="po-flow po-flow-consent" x1="581" y1="262" x2="581" y2="346" marker-start="url(#po-head-optional)" marker-end="url(#po-head-optional)"></line><g><rect class="po-pill po-pill-consent" x="516" y="292" width="130" height="24" rx="12"></rect><text class="po-pill-text po-pill-text-consent" x="581" y="308" text-anchor="middle">approve scopes</text></g></g><g><line class="po-flow po-flow-consent po-flow-dashed" x1="581" y1="262" x2="581" y2="216"></line><line class="po-flow po-flow-consent" x1="581" y1="184" x2="581" y2="160" marker-end="url(#po-head-optional)"></line><g><rect class="po-pill po-pill-consent" x="520" y="188" width="122" height="24" rx="12"></rect><text class="po-pill-text po-pill-text-consent" x="581" y="204" text-anchor="middle">Brand sign-in</text></g></g><text class="po-description" x="508" y="396"><tspan x="508" dy="0">The User logs in with the</tspan><tspan x="508" dy="16.5">Brand and ticks scopes on</tspan><tspan x="508" dy="16.5">the Provider&#x27;s consent</tspan><tspan x="508" dy="16.5">page. The personal agent</tspan><tspan x="508" dy="16.5">never sees the login.</tspan></text></g><g><text class="po-index po-index-consent" x="678" y="46">04</text><text class="po-column-title" x="678" y="67"><tspan x="678" dy="0">Delegation token</tspan></text><g><line class="po-flow po-flow-consent" x1="751" y1="262" x2="751" y2="348" marker-start="url(#po-head-optional)"></line><g><rect class="po-pill po-pill-consent" x="678" y="292" width="146" height="24" rx="12"></rect><text class="po-pill-text po-pill-text-consent" x="751" y="308" text-anchor="middle">delegation token</text></g></g><text class="po-description" x="678" y="396"><tspan x="678" dy="0">The Provider signs a</tspan><tspan x="678" dy="16.5">token listing the</tspan><tspan x="678" dy="16.5">approved scopes (§5.4).</tspan><tspan x="678" dy="16.5">The personal agent</tspan><tspan x="678" dy="16.5">carries it but cannot</tspan><tspan x="678" dy="16.5">change it.</tspan></text></g><g><text class="po-index po-index-trust" x="848" y="46">05</text><text class="po-column-title" x="848" y="67"><tspan x="848" dy="0">Send and receipt</tspan></text><g><line class="po-flow po-flow-trust" x1="921" y1="262" x2="921" y2="346" marker-start="url(#po-head)" marker-end="url(#po-head)"></line><g><rect class="po-pill po-pill-trust" x="868" y="292" width="106" height="24" rx="12"></rect><text class="po-pill-text po-pill-text-trust" x="921" y="308" text-anchor="middle">JWT + token</text></g></g><text class="po-description" x="848" y="396"><tspan x="848" dy="0">Each message carries</tspan><tspan x="848" dy="16.5">both tokens; the Brand&#x27;s</tspan><tspan x="848" dy="16.5">agent acts as the User</tspan><tspan x="848" dy="16.5">only within those scopes</tspan><tspan x="848" dy="16.5">(§5.5). Every reply has</tspan><tspan x="848" dy="16.5">a signed receipt (§5.6).</tspan></text></g></svg>
