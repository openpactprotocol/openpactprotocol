</style><rect class="po-canvas" x="-10" y="0" width="780" height="490"></rect><title id="delegated-authority-title">Delegated authority</title><desc id="delegated-authority-desc">The personal agent requests scopes and shows the User a login link. The User logs in with the Brand and approves scopes directly with the Provider; the personal agent never sees the login. The Provider signs a delegation token that the personal agent carries but cannot edit. On each message the Provider checks the token, and the Brand&#x27;s agent can only use the approved scopes. Every reply carries a signed receipt.</desc><defs><marker id="po-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="po-head"></path></marker><marker id="po-head-setup" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="po-head-setup"></path></marker><marker id="po-head-optional" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="po-head-optional"></path></marker></defs><rect class="po-zone" x="-8" y="4" width="506" height="482" rx="14"></rect><rect class="po-zone po-zone-business" x="498" y="4" width="270" height="482" rx="14"></rect><text class="po-zone-label" x="4" y="24">PERSONAL AGENT SIDE</text><text class="po-zone-label" x="516" y="24">PROVIDER SIDE</text><line class="po-boundary" x1="498" y1="34" x2="498" y2="484"></line><g><rect class="po-actor" x="0" y="72" width="116" height="400" rx="12"></rect><text class="po-actor-title" x="58" y="94" text-anchor="middle">User</text><text class="po-actor-subtitle" x="58" y="109" text-anchor="middle">approves scopes</text></g><g><rect class="po-actor" x="244" y="72" width="184" height="400" rx="12"></rect><text class="po-actor-title" x="336" y="94" text-anchor="middle">Personal agent</text><text class="po-actor-subtitle" x="336" y="109" text-anchor="middle">carries the token</text></g><g><rect class="po-actor" x="568" y="72" width="192" height="400" rx="12"></rect><text class="po-actor-title" x="664" y="94" text-anchor="middle">Provider</text><text class="po-actor-subtitle" x="664" y="109" text-anchor="middle">signs and checks it</text></g><g class="po-person" transform="translate(58 270)"><circle cx="0" cy="-26" r="13"></circle><path d="M -24 18 a 24 24 0 0 1 48 0 z"></path></g><g><rect class="po-part" x="256" y="172" width="160" height="40" rx="8"></rect><text class="po-part-label" x="336" y="190" text-anchor="middle">Assistant</text><text class="po-part-detail" x="336" y="204" text-anchor="middle">shows the link only</text></g><g><rect class="po-part po-part-consent" x="256" y="232" width="160" height="40" rx="8"></rect><text class="po-part-label" x="336" y="250" text-anchor="middle">Delegation token</text><text class="po-part-detail" x="336" y="264" text-anchor="middle">signed · can&#x27;t be edited</text></g><g><rect class="po-part" x="256" y="404" width="160" height="40" rx="8"></rect><text class="po-part-label" x="336" y="422" text-anchor="middle">Receipts</text><text class="po-part-detail" x="336" y="436" text-anchor="middle">verify · keep</text></g><g><rect class="po-part po-part-consent" x="580" y="124" width="168" height="40" rx="8"></rect><text class="po-part-label" x="664" y="142" text-anchor="middle">Brand login + consent</text><text class="po-part-detail" x="664" y="156" text-anchor="middle">User ticks scopes</text></g><g><rect class="po-part po-part-consent" x="580" y="232" width="168" height="40" rx="8"></rect><text class="po-part-label" x="664" y="250" text-anchor="middle">Token signer</text><text class="po-part-detail" x="664" y="264" text-anchor="middle">sub · scope · exp</text></g><g><rect class="po-part" x="580" y="300" width="168" height="40" rx="8"></rect><text class="po-part-label" x="664" y="318" text-anchor="middle">Token check</text><text class="po-part-detail" x="664" y="332" text-anchor="middle">signature · expiry · grant</text></g><g class="po-lock" transform="translate(274 246)"><rect x="-6" y="-2" width="12" height="10" rx="2"></rect><path d="M -3.5 -2 V -5 a 3.5 3.5 0 0 1 7 0 V -2"></path></g><line class="po-internal po-arrow-consent" x1="664" y1="168" x2="664" y2="226" marker-end="url(#po-head-optional)"></line><line class="po-internal" x1="664" y1="344" x2="664" y2="358" marker-end="url(#po-head)"></line><rect class="po-part po-part-accent" x="580" y="364" width="168" height="96" rx="8"></rect><text class="po-part-label" x="664" y="382" text-anchor="middle">Brand&#x27;s agent</text><text class="po-part-detail" x="664" y="396" text-anchor="middle">acts as the User</text><g><rect class="po-chip po-chip-granted" x="592" y="408" width="144" height="18" rx="9"></rect><text class="po-chip-text po-chip-text-granted" x="664" y="420.5" text-anchor="middle">✓ orders:read</text></g><g><rect class="po-chip po-chip-denied" x="592" y="432" width="144" height="18" rx="9"></rect><text class="po-chip-text po-chip-text-denied" x="664" y="444.5" text-anchor="middle">✗ orders:cancel</text></g><path class="po-arrow po-arrow-consent" d="M 58 68 V 52 H 600 V 66" fill="none" marker-end="url(#po-head-optional)"></path><text class="po-arrow-label" x="336" y="39" text-anchor="middle">Log in with the Brand, approve scopes</text><circle class="po-step po-step-optional" cx="336" cy="52" r="9"></circle><text class="po-step-number" x="336" y="55.5" text-anchor="middle">4</text><g><line class="po-arrow po-arrow-consent" x1="432" y1="144" x2="564" y2="144" marker-end="url(#po-head-optional)"></line><text class="po-arrow-label" x="498" y="129" text-anchor="middle">Request scopes</text><circle class="po-step po-step-optional" cx="498" cy="144" r="9"></circle><text class="po-step-number" x="498" y="147.5" text-anchor="middle">1</text></g><g><line class="po-arrow po-arrow-consent" x1="564" y1="192" x2="432" y2="192" marker-end="url(#po-head-optional)"></line><text class="po-arrow-label" x="498" y="177" text-anchor="middle">Login link</text><circle class="po-step po-step-optional" cx="498" cy="192" r="9"></circle><text class="po-step-number" x="498" y="195.5" text-anchor="middle">2</text></g><g><line class="po-arrow po-arrow-consent" x1="240" y1="192" x2="120" y2="192" marker-end="url(#po-head-optional)"></line><text class="po-arrow-label" x="180" y="177" text-anchor="middle">Show link</text><circle class="po-step po-step-optional" cx="180" cy="192" r="9"></circle><text class="po-step-number" x="180" y="195.5" text-anchor="middle">3</text></g><g><line class="po-arrow po-arrow-consent" x1="564" y1="252" x2="432" y2="252" marker-end="url(#po-head-optional)"></line><text class="po-arrow-label" x="498" y="237" text-anchor="middle">Signed delegation token</text><circle class="po-step po-step-optional" cx="498" cy="252" r="9"></circle><text class="po-step-number" x="498" y="255.5" text-anchor="middle">5</text></g><g><line class="po-arrow" x1="432" y1="320" x2="564" y2="320" marker-end="url(#po-head)"></line><text class="po-arrow-label" x="498" y="305" text-anchor="middle">Message + both tokens</text><circle class="po-step" cx="498" cy="320" r="9"></circle><text class="po-step-number" x="498" y="323.5" text-anchor="middle">6</text></g><g><line class="po-arrow" x1="564" y1="424" x2="432" y2="424" marker-end="url(#po-head)"></line><text class="po-arrow-label" x="498" y="409" text-anchor="middle">Reply + signed receipt</text><circle class="po-step" cx="498" cy="424" r="9"></circle><text class="po-step-number" x="498" y="427.5" text-anchor="middle">7</text></g></svg>
